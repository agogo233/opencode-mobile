name: Build Android APK (arm64-v8a)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 3
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # node:test with TS globs needs >=22 (type-stripping + glob);
          # npm test fails outright on 20.
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Go tests (embedded forwarder)
        working-directory: native/tailscale-go
        run: go test ./...

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Restore Tailscale AAR cache
        id: tsnet-aar-cache
        uses: actions/cache@v5
        with:
          path: android/app/libs/mobiletsnet.aar
          key: tsnet-aar-${{ runner.os }}-${{ hashFiles('native/tailscale-go/**', 'scripts/build-tailscale-aar.sh') }}

      - name: Build Tailscale AAR
        if: steps.tsnet-aar-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: bash scripts/build-tailscale-aar.sh

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-arm64-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-arm64-

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Typecheck & unit tests
        run: npm run typecheck && npm test

      - name: Purge stale generated sources
        # The Gradle cache (restore-keys prefix fallback) can restore a
        # generated autolinking tree from a previous package id. Gradle then
        # reuses ReactNativeApplicationEntryPoint.java referencing the OLD
        # package and compileReleaseJavaWithJavac fails. Delete generated
        # sources so prebuild + Gradle regenerate them.
        run: rm -rf android/app/build/generated android/build/generated android/app/build/intermediates

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Setup signing
        run: |
          if [[ -n "${{ secrets.KEYSTORE_BASE64 }}" ]]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
            echo "RELEASE_STORE_FILE=release.keystore" >> "$GITHUB_ENV"
            echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Signing: production keystore"
          else
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Signing: debug keystore (no release signing secrets)"
          fi

      - name: Build release APK (arm64-v8a + x86_64 for CI)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a -PtsAbis=arm64-v8a,x86_64 2>&1 | tee build-output.txt; exit ${PIPESTATUS[0]}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          retention-days: 7
          name: gradle-build-log
          path: android/build-output.txt

      - name: Rename artifact
        run: cp android/app/build/outputs/apk/release/app-release.apk app-release-ci.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          retention-days: 7
          name: app-release-ci
          path: app-release-ci.apk
