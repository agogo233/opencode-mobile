name: Build Android APK (arm64-v8a)

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
      EXPO_PUBLIC_POSTHOG_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_KEY }}
      EXPO_PUBLIC_CHATWOOT_INBOX_IDENTIFIER: ${{ secrets.EXPO_PUBLIC_CHATWOOT_INBOX_IDENTIFIER }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-arm64-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-arm64-

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Purge stale generated sources
        # The Gradle cache (restore-keys prefix fallback) can restore a
        # generated autolinking tree from a previous package id. Gradle then
        # reuses ReactNativeApplicationEntryPoint.java referencing the OLD
        # package and compileReleaseJavaWithJavac fails. Delete generated
        # sources so prebuild + Gradle regenerate them.
        run: rm -rf android/app/build/generated android/build/generated android/app/build/intermediates

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Disable Sentry source map upload
        # This fork's cloud build has no SENTRY_* secrets (the gradle-side
        # sentry-cli upload fails with "Project not found" when they are
        # unset — see run 34354070526). Runtime Sentry.init() is gated on
        # EXPO_PUBLIC_SENTRY_DSN anyway, so dropping the build-time upload
        # loses nothing. Same strip the F-Droid job applies. MUST run AFTER
        # prebuild: the @sentry/react-native/expo config plugin re-adds the
        # apply line each prebuild.
        run: sed -i '/apply from.*sentry.gradle/d' android/app/build.gradle

      - name: Setup signing
        run: |
          if [[ -n "${{ secrets.KEYSTORE_BASE64 }}" ]]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
            echo "RELEASE_STORE_FILE=release.keystore" >> "$GITHUB_ENV"
            echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Signing: production keystore"
          else
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Signing: debug keystore (no release signing secrets)"
          fi

      - name: Build arm64-v8a APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Rename artifact
        run: cp android/app/build/outputs/apk/release/app-release.apk app-release-arm64-v8a.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-arm64-v8a
          path: app-release-arm64-v8a.apk
